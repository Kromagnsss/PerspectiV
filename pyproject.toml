[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "perspectiv"
version = "0.3.6"
description = "Gestion de projets locale multi-utilisateurs avec API et connecteur MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.42",
  "streamlit-aggrid>=1.2",
  "pandas>=2.2",
  "plotly>=5.24",
  "SQLAlchemy>=2.0",
  "alembic>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "mcp>=2.0,<3",
  "PyJWT[crypto]>=2.10",
  "psycopg[binary]>=3.2",
  "Authlib>=1.4",
  "httpx>=0.28",
  "networkx>=3.3",
  "reportlab>=4.2",
  "Babel>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6", "playwright>=1.46"]

[project.scripts]
perspectiv = "perspectiv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["perspectiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
